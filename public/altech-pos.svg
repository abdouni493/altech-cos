<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Altech POS — white "A" crossed by an amber scanner beam on the brand gradient.
       Same drawing as src/components/layout/BrandMark.tsx; rendered to altech-pos.ico
       by scripts/make-icon.py. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C3FE0"/>
      <stop offset="0.55" stop-color="#2F5BFF"/>
      <stop offset="1" stop-color="#00B8D9"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#hl)"/>
  <polyline points="72,198 128,62 184,198" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="50" y1="152" x2="206" y2="152" stroke="#F5A524" stroke-opacity="0.35" stroke-width="26" stroke-linecap="round"/>
  <line x1="50" y1="152" x2="206" y2="152" stroke="#FFC24D" stroke-width="13" stroke-linecap="round"/>
</svg>
